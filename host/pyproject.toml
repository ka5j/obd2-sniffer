[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "obdsniff"
version = "0.3.0"
description = "Laptop tool for the OBD2 CAN Sniffer: command line, interactive shell and desktop app"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Krish Ahuja" }]
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["obdsniff[gui]", "pytest>=8", "pytest-cov>=5", "pytest-qt>=4.4", "ruff==0.17.1"]

[project.scripts]
obdsniff = "obdsniff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["obdsniff"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
